services:
  calculator-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-calculator}:${IMAGE_TAG:-latest}
    container_name: calculator-app-1
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  calculator-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-calculator}:${IMAGE_TAG:-latest}
    container_name: calculator-app-2
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: calculator-nginx-1
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator-app-1:
        condition: service_healthy
      calculator-app-2:
        condition: service_healthy
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  calc-net:
    driver: bridge
