events {
    worker_connections 1024;
}

http {
    log_format upstreamlog '$remote_addr - [$time_local] "$request" $status upstream: $upstream_addr';
    access_log /var/log/nginx/access.log upstreamlog;
    error_log /var/log/nginx/error.log warn;

    upstream calculator_servers {
        server calculator-app-1:8081;
        server calculator-app-2:8081;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://calculator_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /actuator/health {
            proxy_pass http://calculator_servers/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
